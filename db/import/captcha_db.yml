###########################################################################
# Captcha Database Table
###########################################################################
#
# Captcha Database Settings
#
###########################################################################
#   GenerationMethod  "Automated" or "Manual" (Default: Manual)
#                     - Automated: Server generates BMP and answer automatically
#                     - Manual: Requires Filename and Answer fields
#   Filename          Name of the BMP image file (with location). Required if GenerationMethod is Manual.
#   Answer            Correct answer for the captcha (case-sensitive). Required if GenerationMethod is Manual.
#   Bonus             Bonus Script ran on success. (Default: Level 10 Blessing and Increase Agility for 10 minutes)
###########################################################################
 
 Header:
   Type: CAPTCHA_DB
   Version: 1
 
Body:
  # Example: Automated captcha generation
  - Id: 0
    GenerationMethod: Automated
    Bonus: |
      sc_start SC_BLESSING,600000,10;
      sc_start SC_INCREASEAGI,600000,10;
#      sc_start SC_ASSUMPTIO,600000,5;
#      sc_start SC_IMPOSITIO,600000,5;
#      sc_start SC_TRUESIGHT,600000,5;

# Auto-generated captcha notes:
# - If the captcha DB is empty, the server generates in-memory captchas.
# - A built-in bitmap font is used by default (no manual steps required).
# - Optional: add src/thirdparty/stb/stb_truetype.h and db/captcha/font.ttf for higher-quality text.
# - Generated pool size is up to 10 (filled on demand) with 12-character answers.